              margin-top: 4px;
            }

            .form-actions .text-button {
              min-width: 82px;
              border-radius: 7px;
            }

            .form-actions .secondary {
              background: #edf1f3;
            }

            .form-actions .primary {
              background: #4c7c87;
              color: white;
            }

            @media (max-width: 900px) {
              :host,
              ha-card,
              .shell {
                min-height: 100vh;
              }

              .topbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 14px 14px 8px;
              }

              .title h1 {
                font-size: 24px;
              }

              .time {
                font-size: 18px;
              }

              .people {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                padding: 0 14px 10px;
              }

              .calendar {
                grid-template-columns: 48px repeat(${days.length}, minmax(128px, 1fr));
                overflow-x: auto;
              }
            }
          </style>
          <ha-card>
            <div class="shell">
              <main class="main">
                <section class="topbar">
                  <div class="title">
                    <h1>${this.config.title}</h1>
                    <div class="time">${this._formatTime(now)}</div>
                  </div>
                  <div class="actions">
                    <div class="controls" aria-label="Calendar controls">
                      <button class="icon-button" type="button" data-action="previous" aria-label="Previous days">
                        <ha-icon icon="mdi:chevron-left"></ha-icon>
                      </button>
                      <button class="text-button" type="button" data-action="today">Today</button>
                      <button class="icon-button" type="button" data-action="next" aria-label="Next days">
                        <ha-icon icon="mdi:chevron-right"></ha-icon>
                      </button>
                    </div>
                    <button class="icon-button pill" type="button" data-action="refresh" aria-label="Refresh calendar">
                      <ha-icon icon="mdi:refresh"></ha-icon>
                    </button>
                  </div>
                </section>
                <section class="people">
                  ${(() => {
                    const counts = calendars.map((calendar) => this._events.filter((event) => event.entity_id === calendar.entity).length);
                    const maxCount = Math.max(1, ...counts);
                    return calendars.map((calendar, index) => {
                    const count = counts[index];
                    const fill = `${Math.round((count / maxCount) * 100)}%`;
                    const active = this._activeCalendar === "all" || this._activeCalendar === calendar.entity;
                    return `
                      <button class="person ${active ? "active" : ""}" type="button" data-action="filter-calendar" data-entity="${calendar.entity}" style="--person-color:${calendar.color}; --person-fill:${fill}">
                        <span class="avatar" style="background:${calendar.color}">${calendar.initial || calendar.name?.[0] || "?"}</span>
                        <span class="name">${calendar.name || calendar.entity}</span>
                        <span class="count">${count}</span>
                        <span class="line"></span>
                      </button>
                    `;
                    }).join("");
                  })()}
                </section>
                <section class="calendar">
                  <div></div>
                  ${days.map((day) => `
                    <div class="day-head">
                      <span>${day.toLocaleDateString([], { weekday: "short" })}</span>
                      ${this._dateKey(day) === this._dateKey(now) ? `<span class="today">${day.getDate()}</span>` : `<span>${day.getDate()}</span>`}
                    </div>
                  `).join("")}
                  <div></div>
                  ${days.map((day) => {
                    const allDay = this._visibleEventsForDay(day).filter((event) => this._allDay(event)).slice(0, 1);
                    return `
                      <div class="all-day">
                        ${allDay.map((event) => {
                          const calendar = this._calendarFor(event.entity_id);
                          return `<button class="meal" type="button" data-action="select-event" data-event-id="${this._eventId(event)}" style="--event-color:${calendar.color || "#f7b6a3"}"><ha-icon icon="mdi:calendar-star"></ha-icon>${this._escape(event.summary || event.message || "All day")}</button>`;
                        }).join("")}
                        ${!allDay.length ? `<button class="meal add-meal" type="button" data-action="create-all-day" data-date="${this._dateKey(day)}"><ha-icon icon="mdi:plus"></ha-icon>Add</button>` : ""}
                      </div>
                    `;
                  }).join("")}
                  <div class="time-col">
                    ${hours.map((hour, index) => `<div style="top:${(index / Math.max(1, hours.length - 1)) * 100}%">${hour === 12 ? "12 pm" : hour > 12 ? `${hour - 12} pm` : `${hour} am`}</div>`).join("")}
                  </div>
                  ${days.map((day) => `
                    <div class="day-col" data-action="create-event" data-date="${this._dateKey(day)}">
                      ${this._visibleEventsForDay(day).filter((event) => !this._allDay(event)).map((event) => {
                        const calendar = this._calendarFor(event.entity_id);
                        const start = this._eventTime(event.start);
                        const end = this._eventTime(event.end);
                        return `
                          <button class="event" type="button" data-action="select-event" data-event-id="${this._eventId(event)}" style="${this._eventStyle(event)}">
                            <div class="event-title">${this._escape(event.summary || event.message || "Calendar event")}</div>
                            <div class="event-time">${this._formatTime(start)} - ${this._formatTime(end)}</div>
                            <span class="avatar" style="background:${calendar.color || "#6b9bd2"}">${calendar.initial || calendar.name?.[0] || "?"}</span>
                          </button>
                        `;
                      }).join("")}
                      ${!this._loading && !this._visibleEventsForDay(day).length ? `<div class="empty">No events</div>` : ""}
                      ${this._loading ? `<div class="loading">Loading calendar</div>` : ""}
                    </div>
                  `).join("")}
                </section>
              </main>
            </div>
            ${this._selectedEventMarkup()}
            ${this._createEventMarkup()}
          </ha-card>
        `;
        this._bindInteractions();
      }

      _bindInteractions() {
        this.shadowRoot.querySelectorAll("[data-action]").forEach((node) => {
          node.addEventListener("click", (event) => {
            const action = node.dataset.action;
            if (action === "keep-open") {
              event.stopPropagation();
              return;
            }

            event.preventDefault();
            event.stopPropagation();

            if (action === "previous") this._shiftDays(-Number(this.config.days || 5));
            if (action === "next") this._shiftDays(Number(this.config.days || 5));
            if (action === "today") this._goToday();
            if (action === "refresh") this._refreshEvents();
            if (action === "filter-calendar") this._toggleCalendar(node.dataset.entity);
            if (action === "select-event") this._selectEvent(node.dataset.eventId);
            if (action === "close-details") this._closeDetails();
            if (action === "create-event") {
              if (event.target.closest("[data-action='select-event']")) return;
              const date = this._dateFromKey(node.dataset.date);
              this._openCreateDialog(date, this._minutesFromPointer(event, node), false);
            }
            if (action === "create-all-day") {
              this._openCreateDialog(this._dateFromKey(node.dataset.date), 0, true);
            }
            if (action === "close-create") this._closeCreateDialog();
          });
        });

        const form = this.shadowRoot.querySelector(".create-form");
        if (form) {
          form.addEventListener("submit", (event) => {
            event.preventDefault();
            event.stopPropagation();
            this._saveDraftEvent(form);
          });
        }
      }
    }

    customElements.define("skylight-calendar-card", SkylightCalendarCard);
